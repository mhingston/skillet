    type: single
    query: issue triage prioritization ownership handoff workflow
    relevant_ids: [rev-issue-triage-skill]
    scope: {}
    forbidden_ids: [rev-a-architecture-skill, rev-a-deploy-tool, rev-b-deploy-tool]
  - id: tempting-tool-must-not-beat-skill
    type: single
    query: incident outage mitigation stakeholder communication runbook
    relevant_ids: [rev-incident-skill]
    scope: {}
    forbidden_ids: [rev-a-architecture-skill, rev-a-deploy-tool, rev-b-deploy-tool]
