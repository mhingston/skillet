    scope: {}
    forbidden_ids: [rev-a-architecture-skill, rev-a-deploy-tool, rev-b-deploy-tool]
  - id: playbook-best-match
    type: single
    query: canary rollout rollback production release playbook sequence
    relevant_ids: [rev-release-playbook]
    scope: {}
    forbidden_ids: [rev-a-architecture-skill, rev-a-deploy-tool, rev-b-deploy-tool]
  - id: tool-best-match
    type: single
    query: search GitHub issues labels assignee state repository query
    relevant_ids: [rev-github-issues-tool]
    scope: {}
    forbidden_ids: [rev-a-architecture-skill, rev-a-deploy-tool, rev-b-deploy-tool]
  - id: similar-name-tool-intent
    type: single
    query: issue triage search labels assignee state query
    relevant_ids: [rev-github-issues-tool]
    scope: {}
    forbidden_ids: [rev-a-architecture-skill, rev-a-deploy-tool, rev-b-deploy-tool]
