      namespace: team
      repository: repo-a
    forbidden_ids: [rev-b-deploy-tool]
  - id: local-skill-scope
    type: single
    query: repository A architecture module dependency boundary analysis
    relevant_ids: [rev-a-architecture-skill]
    scope:
      namespace: team
      repository: repo-a
    forbidden_ids: [rev-b-deploy-tool]
