version: 2

project_name: skillet

builds:
  - id: skillet
    main: ./cmd/skillet
    binary: skillet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mhingston/skillet/internal/httpserver.Version={{ .Version }}

archives:
  - ids:
      - skillet
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native

release:
  prerelease: auto
