name: verify-v1.0.0

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify v1.0.0 GitHub Release and assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v1.0.0")"

          jq -e '
            .tag_name == "v1.0.0" and
            .draft == false and
            .prerelease == false
          ' <<< "${release_json}" >/dev/null

          expected_assets=(
            checksums.txt
            skillet_1.0.0_linux_amd64
            skillet_1.0.0_linux_arm64
            skillet_1.0.0_darwin_amd64
            skillet_1.0.0_darwin_arm64
            skillet_1.0.0_windows_amd64.exe
            skillet_1.0.0_windows_arm64.exe
          )

          for asset in "${expected_assets[@]}"; do
            jq -e --arg asset "${asset}" '
              any(.assets[]; .name == $asset and .size > 0)
            ' <<< "${release_json}" >/dev/null || {
              echo "Missing or empty release asset: ${asset}"
              exit 1
            }
          done
