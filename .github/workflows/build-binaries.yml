name: build-binaries

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            extension: ''
          - goos: linux
            goarch: arm64
            extension: ''
          - goos: darwin
            goarch: amd64
            extension: ''
          - goos: darwin
            goarch: arm64
            extension: ''
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build skillet
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          binary="skillet-${GOOS}-${GOARCH}${EXTENSION}"
          go build -trimpath -ldflags="-s -w" -o "dist/${binary}" ./cmd/skillet
          cd dist
          sha256sum "${binary}" > "${binary}.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: skillet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/skillet-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
            dist/skillet-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}.sha256
          if-no-files-found: error
