name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/skillet-eval --fixtures evals/retrieval.yaml
      - run: docker build -t skillet:ci .
      - name: Validate Agent Skills fixtures with skills-ref
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref'
      - run: skills-ref validate testdata/valid-skills/plan
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
