name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run deterministic verification gate
        run: go run ./cmd/skillet-verify
      - name: Show verification evidence
        if: always()
        run: |
          if [ -f artifacts/verification/verification.json ]; then
            cat artifacts/verification/verification.json
            {
              echo '## Deterministic verification evidence'
              echo '```json'
              cat artifacts/verification/verification.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/verification/enterprise-acceptance.json ]; then
            cat artifacts/verification/enterprise-acceptance.json
            {
              echo '## M2 enterprise acceptance evidence'
              echo '```json'
              cat artifacts/verification/enterprise-acceptance.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/verification/m3-acceptance.json ]; then
            cat artifacts/verification/m3-acceptance.json
            {
              echo '## M3 human/adoption acceptance evidence'
              echo '```json'
              cat artifacts/verification/m3-acceptance.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 7
      - run: docker build -t skillet:ci .
      - name: Validate Agent Skills fixtures with skills-ref
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install 'git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref'
      - run: skills-ref validate testdata/valid-skills/plan
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
