name: bootstrap-v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.0
      TARGET_COMMIT: e2502254f4ee6d5d736a5eb42523453456b6f945
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure v1.0.0 tag
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            existing_commit="$(git rev-list -n 1 "${TAG}")"
            if [[ "${existing_commit}" != "${TARGET_COMMIT}" ]]; then
              echo "${TAG} already exists at ${existing_commit}; expected ${TARGET_COMMIT}. Refusing to move a release tag."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG}" "${TARGET_COMMIT}" -m "Skillet ${TAG}"
            git push origin "${TAG}"
          fi

          git checkout "${TAG}"

      - name: Check for existing GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Publish v1.0.0
        if: steps.release.outputs.exists != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize v1.0.0 Windows assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          rm -rf release-dist
          mkdir release-dist
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-dist

          rm -f \
            release-dist/checksums.txt \
            release-dist/skillet_1.0.0_windows_amd64.exe.exe \
            release-dist/skillet_1.0.0_windows_arm64.exe.exe

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o release-dist/skillet_1.0.0_windows_amd64.exe ./cmd/skillet

          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" \
            -o release-dist/skillet_1.0.0_windows_arm64.exe ./cmd/skillet

          (
            cd release-dist
            sha256sum \
              skillet_1.0.0_darwin_amd64 \
              skillet_1.0.0_darwin_arm64 \
              skillet_1.0.0_linux_amd64 \
              skillet_1.0.0_linux_arm64 \
              skillet_1.0.0_windows_amd64.exe \
              skillet_1.0.0_windows_arm64.exe \
              > checksums.txt
          )

          gh release upload "${TAG}" \
            release-dist/skillet_1.0.0_windows_amd64.exe \
            release-dist/skillet_1.0.0_windows_arm64.exe \
            release-dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          for bad_asset in \
            skillet_1.0.0_windows_amd64.exe.exe \
            skillet_1.0.0_windows_arm64.exe.exe
          do
            asset_id="$(jq -r --arg name "${bad_asset}" '.assets[] | select(.name == $name) | .id' <<< "${release_json}")"
            if [[ -n "${asset_id}" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done

      - name: Verify v1.0.0 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          jq -e '
            .tag_name == "v1.0.0" and
            .draft == false and
            .prerelease == false
          ' <<< "${release_json}" >/dev/null

          expected_assets=(
            checksums.txt
            skillet_1.0.0_linux_amd64
            skillet_1.0.0_linux_arm64
            skillet_1.0.0_darwin_amd64
            skillet_1.0.0_darwin_arm64
            skillet_1.0.0_windows_amd64.exe
            skillet_1.0.0_windows_arm64.exe
          )

          for asset in "${expected_assets[@]}"; do
            jq -e --arg asset "${asset}" '
              any(.assets[]; .name == $asset and .size > 0)
            ' <<< "${release_json}" >/dev/null || {
              echo "Missing or empty release asset: ${asset}"
              exit 1
            }
          done

          for bad_asset in \
            skillet_1.0.0_windows_amd64.exe.exe \
            skillet_1.0.0_windows_arm64.exe.exe
          do
            jq -e --arg asset "${bad_asset}" '
              all(.assets[]; .name != $asset)
            ' <<< "${release_json}" >/dev/null || {
              echo "Unexpected legacy release asset still present: ${bad_asset}"
              exit 1
            }
          done
